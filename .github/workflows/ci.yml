name: Polycircle CI

on:
  workflow_dispatch:
  push:
    branches: ["restart-foundation", "main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: polycircle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Build Android debug APK
        shell: bash
        run: |
          # google-services.json is intentionally not committed. The Android
          # debug build only needs structurally valid Google Services input,
          # so CI creates a non-secret demo config for compile validation.
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "demo-polycircle",
              "storage_bucket": "demo-polycircle.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.polycircle.app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "demo-not-a-real-api-key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          flutter build apk --debug --no-pub
          rm -f android/app/google-services.json

  ios-regression:
    name: iOS simulator build regression
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Normalize and validate iOS native host
        run: bash tool/ensure_ios_runtime.sh
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-pub

  functions:
    name: Functions build, test and load
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install locked dependencies without package scripts
        run: npm ci --ignore-scripts
      - name: TypeScript build
        run: npm run build
      - name: Check local emulator seed script
        run: npm run check:seed
      - name: Run pure backend behavior tests
        run: npm test
      - name: Load compiled Functions module
        env:
          GCLOUD_PROJECT: demo-polycircle
          FIREBASE_CONFIG: '{"projectId":"demo-polycircle","storageBucket":"demo-polycircle.appspot.com"}'
        run: node -e "require('./lib/entry.js'); console.log('Functions module loaded successfully')"

  contracts:
    name: Client/backend security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Check development shell scripts
        run: bash -n tool/*.sh
      - name: Scan repository for committed secrets and unsafe client paths
        run: bash tool/security_static_scan.sh
      - name: Run static contract tests
        run: node --test tests/contracts/*.test.mjs

  security-rules:
    name: Firebase security rules
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase CLI without package scripts
        run: npm install -g --ignore-scripts firebase-tools@15.28.1
      - name: Install locked security test dependencies without package scripts
        working-directory: tests/security
        run: npm ci --ignore-scripts
      - name: Run Firestore and Storage rules tests
        run: firebase emulators:exec --project demo-polycircle --only firestore,storage "npm --prefix tests/security test"
