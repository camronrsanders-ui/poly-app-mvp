name: Polycircle CI

on:
  workflow_dispatch:
  push:
    branches: ["restart-foundation", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test

  functions:
    name: Functions build and load
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: Load compiled Functions module
        run: node -e "require('./lib/index.js'); console.log('Functions module loaded successfully')"

  contracts:
    name: Client/backend callable contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run callable contract tests
        run: node --test tests/contracts/callable_contracts.test.mjs

  security-rules:
    name: Firebase security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install security test dependencies
        working-directory: tests/security
        run: npm install
      - name: Run Firestore and Storage rules tests
        run: firebase emulators:exec --project demo-polycircle --only firestore,storage "npm --prefix tests/security test"
