name: Polycircle CI

on:
  push:
    branches: ["restart-foundation", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze

  functions:
    name: Functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build

  security-rules:
    name: Firebase security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install security test dependencies
        working-directory: tests/security
        run: npm install
      - name: Run Firestore and Storage rules tests
        run: firebase emulators:exec --project demo-polycircle --only firestore,storage "npm --prefix tests/security test"
