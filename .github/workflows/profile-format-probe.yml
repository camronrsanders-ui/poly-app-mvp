name: Profile Format Probe

on:
  push:
    branches:
      - restart-foundation

permissions:
  contents: read

jobs:
  profile-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - name: Print pinned formatter output
        run: dart format --output=show lib/screens/profile/profile_screen.dart
