name: Polycircle Dependency Audit

on:
  workflow_dispatch:
  push:
    branches: ["restart-foundation", "main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: polycircle-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions-production-dependencies:
    name: Functions production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependency graph without running package scripts
        working-directory: functions
        run: npm install --ignore-scripts
      - name: Fail on high or critical production dependency advisories
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high
