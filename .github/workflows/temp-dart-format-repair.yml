name: Temporary Dart Format Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting in runner workspace
        run: dart format lib/screens/messages/shared_moments_screen.dart lib/screens/messages/shared_plans_screen.dart
      - name: Emit formatted source for repair commit
        run: |
          echo 'MOMENTS_B64_BEGIN'
          base64 -w0 lib/screens/messages/shared_moments_screen.dart
          echo
          echo 'MOMENTS_B64_END'
          echo 'PLANS_B64_BEGIN'
          base64 -w0 lib/screens/messages/shared_plans_screen.dart
          echo
          echo 'PLANS_B64_END'
