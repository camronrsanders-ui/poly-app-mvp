name: Temporary Dart Format Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Emit canonical Dart formatter diff
        run: |
          dart format lib/screens/messages/chat_screen.dart
          git diff -- lib/screens/messages/chat_screen.dart
