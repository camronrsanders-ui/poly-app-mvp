name: Temporary Dart Format Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: restart-foundation
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Apply single plan analyzer repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/messages/shared_plans_screen.dart')
          text = path.read_text()
          old = """                                      if (value == 'edit')
                                        _editPlan(plan: plan);
                                      if (value == 'cancel') _cancel(plan);
"""
          new = """                                      if (value == 'edit') {
                                        _editPlan(plan: plan);
                                      }
                                      if (value == 'cancel') {
                                        _cancel(plan);
                                      }
"""
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one plan options snippet to repair.')
          path.write_text(text.replace(old, new))
          PY
          dart format lib/screens/messages/shared_plans_screen.dart
      - name: Commit repair and remove this temporary workflow
        run: |
          git rm .github/workflows/temp-dart-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/messages/shared_plans_screen.dart
          git commit -m "fix(messages): satisfy plan action lint"
          git push origin HEAD:restart-foundation
