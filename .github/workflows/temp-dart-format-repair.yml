name: Temporary Dart Format Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: restart-foundation
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Apply CI-equivalent canonical formatting and self-clean
        run: |
          flutter pub get
          dart format lib/screens/messages/chat_screen.dart
          dart format --output=none --set-exit-if-changed lib test
          git restore -- pubspec.lock
          git diff --name-only
          changed="$(git diff --name-only)"
          test "$changed" = "lib/screens/messages/chat_screen.dart"
          git rm .github/workflows/temp-dart-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/messages/chat_screen.dart
          git commit -m "style(messages): match CI Dart formatting"
          git push origin HEAD:restart-foundation
